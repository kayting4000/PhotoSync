name: photosync
description: "PhotoSync - Photo Management & Grade Management System"
publish_to: 'none'

version: 37.0.0+37

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  image_picker: ^0.8.6
  http: ^1.1.0
  flutter_secure_storage: ^8.0.0

  # Date/time handling
  intl: ^0.19.0

  # Navigation
  go_router: ^12.0.0

  # Notifications
  fluttertoast: ^8.2.0

  # Theme persistence
  shared_preferences: ^2.2.0

  # Offline / local database
  sqflite: ^2.3.0
  path: ^1.8.0

  # Connectivity monitoring
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ensure these are indented by exactly 2 spaces
  assets:
    - assets/images/
    - assets/icons/

