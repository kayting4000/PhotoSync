name: eduscan
description: "EduScan - Test Paper Scanner and Student Information Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.0
  
  # Supabase integration
  supabase_flutter: ^1.10.0
  
  # Image handling
  image_picker: ^1.0.0
  image: ^4.1.0
  
  # Camera for mobile scanning
  camera: ^0.10.5+5
  
  # HTTP and serialization
  http: ^1.1.0
  dio: ^5.3.0
  
  # Date/time handling
  intl: ^0.19.0
  
  # UI components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  smooth_page_indicator: ^1.0.1
  
  # Navigation
  go_router: ^12.0.0
  
  # Notifications
  fluttertoast: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
