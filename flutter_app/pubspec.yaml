name: eduscan
description: "EduScan - Test Paper Scanner and Student Information Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.0
  
  # Supabase integration
  supabase_flutter: ^2.3.0
  
  # Image handling
  image_picker: ^1.0.0
  image: ^4.1.0

  # HTTP and serialization
  http: ^1.1.0
  dio: ^5.3.0

  # Date/time handling
  intl: ^0.19.0

  # UI components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7

  # Navigation
  go_router: ^12.0.0

  # Notifications
  fluttertoast: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ensure these are indented by exactly 2 spaces
  assets:
    - assets/images/
    - assets/icons/

