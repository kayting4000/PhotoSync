name: PhotoSync CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-web:
    name: Lint & Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r backend/requirements.txt flake8

      - name: Flake8
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt

      - name: Verify imports
        run: cd backend && python -c "import main; print('Backend imports OK')"

  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - run: cd flutter_app && flutter pub get

      - name: Analyze
        run: cd flutter_app && flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK
        run: cd flutter_app && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: photosync-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
